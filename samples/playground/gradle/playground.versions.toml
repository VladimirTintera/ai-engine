# Versions only the playground uses. AGP, Kotlin, coroutines and the rest come from the library's
# catalog (../../gradle/libs.versions.toml, accessor `libs`).
[versions]
# Latest stable Compose Multiplatform; works with Kotlin 2.4 (the Compose compiler is the Kotlin plugin).
compose-multiplatform = "1.12.2"
# Material 3 Expressive (MaterialExpressiveTheme with its components: ButtonGroup, LoadingIndicator,
# wavy progress indicators…) exists ONLY in alpha builds of the Compose Multiplatform material3;
# the last stable one (1.9.0) has just the theme. 1.12.0-alpha03 is built against Compose 1.12.
material3 = "1.12.0-alpha03"
ktor = "3.6.1"
kotlinx-serialization = "1.12.0"
androidx-activity = "1.13.0"
# Play Feature Delivery brings an old androidx.fragment transitively; activity-result APIs need 1.3+
# (lint InvalidFragmentVersionForActivityResult fails the release build otherwise).
androidx-fragment = "1.9.1"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }

[plugins]
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
